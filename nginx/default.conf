server {
    listen 80;

    location /auth/ {
        proxy_pass http://auth:3001/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }


    location /posts/ {

        auth_request /internal/auth/verify;

        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_pass http://post:3002/;
    }


    location = /internal/auth/verify {
        internal;

        proxy_pass http://auth:3001/api/v1/token/verify-token;
        

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Authorization $http_authorization;

        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }


    error_page 401 = @json401error;

    location @json401error {
        default_type application/json;
        return 401 '{"success":false,"message":"Unauthorized from Nginx"}';
    }

    error_page 500 = @json500error;

    location @json500error {
        default_type application/json;
        return 500 '{"success":false,"message":"Internal Server Error"}';
    }

    error_page 502 = @json502error;

    location @json502error {
        default_type application/json;
        return 502 '{"success":false,"message":"Bad Gateway"}';
    }
}