version: '3.9'

services:

  auth:
    build: ./auth

    ports:
      - '3001:3001'

    depends_on:
      - auth-db

    environment:
      PORT: 3001
      MONGO_URL: mongodb://auth-db:27017/authdb
      JWT_SECRET: dipronil_secret_key

    volumes:
      - ./auth:/app
      - /app/node_modules

  post:
    build: ./post

    ports:
      - '3002:3002'

    depends_on:
      - post-db

    environment:
      PORT: 3002
      JWT_SECRET: dipronil_secret_key
      MONGO_URL: mongodb://post-db:27017/postdb

    volumes:
      - ./post:/app
      - /app/node_modules

  # nginx:
  #   build: ./nginx

  #   ports:
  #     - '80:80'

  #   depends_on:
  #     - auth
  #     - post

  auth-db:
    image: mongo

    ports:
      - '27017:27017'

    volumes:
      - auth-data:/data/db

  post-db:
    image: mongo

    ports:
      - '27018:27017'

    volumes:
      - post-data:/data/db

volumes:
  auth-data:
  post-data: